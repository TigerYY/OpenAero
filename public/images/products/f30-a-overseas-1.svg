<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="800" height="600" fill="#3B82F6"/>
  
  <!-- 渐变遮罩 -->
  <defs>
    <linearGradient id="grad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(0,0,0,0.1);stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#grad8)"/>
  
  <!-- 无人机图标（简化版） -->
  <g transform="translate(400, 200)">
    <!-- 主体 -->
    <ellipse cx="0" cy="0" rx="120" ry="80" fill="rgba(255,255,255,0.2)" stroke="#FFFFFF" stroke-width="3"/>
    <!-- 旋翼臂 -->
    <line x1="-80" y1="-40" x2="-120" y2="-80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="-40" x2="120" y2="-80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="-80" y1="40" x2="-120" y2="80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <line x1="80" y1="40" x2="120" y2="80" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <!-- 旋翼 -->
    <circle cx="-120" cy="-80" r="25" fill="rgba(255,255,255,0.3)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="120" cy="-80" r="25" fill="rgba(255,255,255,0.3)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="-120" cy="80" r="25" fill="rgba(255,255,255,0.3)" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="120" cy="80" r="25" fill="rgba(255,255,255,0.3)" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  
  <!-- 文字信息 -->
  <text x="400" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    F30-A
  </text>
  <text x="400" y="490" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" text-anchor="middle">
    30L
  </text>
  <text x="400" y="530" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)" text-anchor="middle">
    海外版
  </text>
</svg>