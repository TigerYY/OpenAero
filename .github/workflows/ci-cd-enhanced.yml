name: Enhanced CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '18'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 环境配置验证
  validate-env:
    name: Validate Environment Configuration
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Validate environment configuration
      run: npm run config:validate
      continue-on-error: true

    - name: Check required environment variables
      run: |
        echo "Checking required environment variables..."
        node -e "
          const { checkRequiredEnvVars } = require('./src/config/env.ts');
          const { missing, present } = checkRequiredEnvVars();
          if (missing.length > 0) {
            console.error('Missing required env vars:', missing);
            process.exit(1);
          }
          console.log('All required env vars present:', present);
        "

  # 代码质量检查
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    needs: [validate-env]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint
      continue-on-error: false

    - name: Run type check
      run: npm run type-check
      continue-on-error: false

    - name: Run tests
      run: npm run test:ci
      env:
        CI: true
      continue-on-error: false

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      if: always()
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella

  # 安全扫描
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

  # 构建和推送 Docker 镜像
  build-and-push:
    name: Build and Push Docker Image
    needs: [lint-and-test, security-scan]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.production
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NODE_ENV=production

    - name: Image digest
      run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

  # 部署到 Staging
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: 
      name: staging
      url: ${{ secrets.STAGING_URL }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to staging server
      run: |
        echo "Deploying to staging environment..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.STAGING_HOST }} << 'EOF'
          cd /path/to/app
          git pull origin develop
          docker-compose -f docker-compose.staging.yml pull
          docker-compose -f docker-compose.staging.yml up -d
          docker-compose -f docker-compose.staging.yml exec -T app npm run config:validate
        EOF

    - name: Wait for deployment
      run: |
        echo "Waiting for application to be ready..."
        sleep 30

    - name: Health check
      run: |
        echo "Performing health check..."
        curl -f ${{ secrets.STAGING_URL }}/api/health || exit 1

  # 部署到 Production
  deploy-production:
    name: Deploy to Production
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: 
      name: production
      url: ${{ secrets.PRODUCTION_URL }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to production server
      run: |
        echo "Deploying to production environment..."
        ssh -o StrictHostKeyChecking=no ${{ secrets.PRODUCTION_HOST }} << 'EOF'
          cd /path/to/app
          git pull origin main
          docker-compose -f docker-compose.production.yml pull
          docker-compose -f docker-compose.production.yml up -d
          docker-compose -f docker-compose.production.yml exec -T app npm run config:validate
        EOF

    - name: Wait for deployment
      run: |
        echo "Waiting for application to be ready..."
        sleep 30

    - name: Health check
      run: |
        echo "Performing health check..."
        curl -f ${{ secrets.PRODUCTION_URL }}/api/health || exit 1

  # 部署后测试
  post-deploy-tests:
    name: Post-Deployment Tests
    needs: [deploy-staging, deploy-production]
    runs-on: ubuntu-latest
    if: always() && (needs.deploy-staging.result == 'success' || needs.deploy-production.result == 'success')
    
    strategy:
      matrix:
        environment: 
          - name: staging
            url: ${{ secrets.STAGING_URL }}
            condition: ${{ needs.deploy-staging.result == 'success' }}
          - name: production
            url: ${{ secrets.PRODUCTION_URL }}
            condition: ${{ needs.deploy-production.result == 'success' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run smoke tests
      run: |
        echo "Running smoke tests for ${{ matrix.environment.name }}..."
        npm run test:smoke -- --base-url=${{ matrix.environment.url }}
      continue-on-error: true

    - name: Run E2E tests
      run: |
        echo "Running E2E tests for ${{ matrix.environment.name }}..."
        npm run test:e2e -- --base-url=${{ matrix.environment.url }}
      continue-on-error: true

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results-${{ matrix.environment.name }}
        path: test-results/

  # 性能测试
  performance-test:
    name: Performance Test
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Lighthouse CI
      uses: treosh/lighthouse-ci-action@v10
      with:
        configPath: './lighthouserc.js'
        uploadArtifacts: true
        temporaryPublicStorage: true
        urls: |
          ${{ secrets.STAGING_URL }}
          ${{ secrets.STAGING_URL }}/solutions
          ${{ secrets.STAGING_URL }}/shop/products

  # 通知
  notify:
    name: Notify Deployment Status
    needs: [deploy-staging, deploy-production, post-deploy-tests]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Send notification
      run: |
        echo "Deployment completed"
        # 这里可以添加 Slack、Discord 或其他通知服务
        # 例如: curl -X POST ${{ secrets.SLACK_WEBHOOK }} -d "Deployment completed"

